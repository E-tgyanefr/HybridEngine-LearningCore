# ============================================================================
# 三平台 CI —— **让 Linux / macOS 真的跑一遍**
#
# ## 为什么要有这个文件
#
# 作者的目标里有一条「上述所有项目要移植到 windows / linux / macos 上」。
#
# ⚠⚠ **但开发机只有 Windows，没有 WSL、没有 Linux、没有 macOS。**
#    `_build/_check_platform.py`、`_build/build_linux_packages.sh`、
#    `build_macos_app.sh` 都写好了，**在真 Linux/macOS 上一次都没跑过**。
#    ⇒ 这个 CI 是补上那一半的**唯一**办法。
#
# ## ⚠⚠ 第一版为什么一个 job 都没起（实测教训，别重犯）
#
# 第一版把 **job 的 id 和 matrix 的键名都写成了中文**：
#
#     jobs:
#       检查:                        ← 中文 job id
#         strategy:
#           matrix:
#             include:
#               - 名字: Windows      ← 中文 matrix 键
#                 系统: windows-2025
#
# 结果：工作流**被触发**了、`conclusion=failure`，但
#   `jobs.total_count = 0` —— **一个 job 都没生成**，
#   而且 `created_at == updated_at`（同一秒）⇒ **启动时就失败了，根本没跑**。
#
# ⇒ 教训：**GitHub 工作流的结构性键名用 ASCII。**
#    中文可以放在 `name:` 的值里（那是显示用的字符串，没问题），
#    但 **job id / matrix 键不要用中文**。
#    ⚠ 而且这种失败**没有任何日志** —— 只能从"0 个 job"倒推。
#
# ## 它跑什么（刻意只跑**不需要联网、不需要第三方依赖**的东西）
#
#    ① `_build/_check_platform.py`   —— 平台自检（退出码 0/1 明确）
#    ② `_build/run_tests.py`         —— 全套 351 + 7
#
# ⚠ **不跑**打包装（PyInstaller / AppImage / .deb / .app）：
#   那些要装一堆东西、耗时长。先把"能不能跑"这一步验了。
#
# ## ⚠ tkinter：Linux 上要装
#
# Ubuntu 的 python3 默认**不带 tkinter**（它是单独的 `python3-tk` 包），
# 而这个项目的两个图形界面都靠它。`actions/setup-python` 那份自带 Tk，
# 所以 apt 那步是**兜底**，加了更稳。
#
# ⚠ macOS runner 没有显示器，但 Tk 在 macOS 上不走 X
#   ⇒ 建窗口会成功（只是没人看得见），不用 xvfb。
# ============================================================================

name: 三平台

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  #: ⚠ job id 必须是 ASCII（见上面那段教训）
  check:
    #: ⚠ 这里是**值**，可以用中文 —— 它会显示在 GitHub 界面上
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      #: ⚠ 不要让一个平台挂了把别的取消掉 —— 三个平台的结果**要各自看到**
      fail-fast: false
      matrix:
        include:
          - label: Windows
            #: ⚠ 钉死的标签，不是 `windows-latest`
            #:   （`-latest` 会自己换 OS，那种红看起来像"代码坏了"）
            #:   2026-10-13 查上游：windows-latest == Windows Server 2025
            runner: windows-2025
          - label: Linux
            #: 2026-10-13 查上游：ubuntu-latest == Ubuntu 24.04
            #:   而 26.04 已可用、迁移窗口 2026-10-19~11-19 ⇒ 钉住
            runner: ubuntu-24.04
          - label: macOS
            #: 2026-10-13 查上游：macos-latest == macOS 26 **arm64**
            runner: macos-26

    steps:
      - uses: actions/checkout@v4

      #: ⚠ 3.12 —— 和开发机同版本（Python 3.12.10），少一类"只有某个版本才炸"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb

      #: ⚠ 不是装饰 —— 平台相关的红最难查的就是"代码坏了还是 runner 换了"
      - name: Environment (diagnostics)
        shell: bash
        run: |
          python -c "import sys; print('Python', sys.version)"
          python -c "import sys, platform; print('platform', sys.platform, platform.machine())"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      #: 主判据①：平台自检（平台/版本/38 个子模块/tkinter/内容根/编码/
      #:          大小写冲突/Windows 假设扫描/工具链/shell 脚本）
      - name: Platform self-check
        run: python _build/_check_platform.py

      #: ⭐⭐ 主判据①.5：**构建 C++ 内核 `libhblight` 并逐位对账**。
      #:
      #:   ⚠⚠ 为什么必须放这里（2026-10-14）：
      #:     队友做完第一层时**只在本机 Windows 构建过**，而他自己如实写了：
      #:     「**跨平台只写了、没构建过** —— 本机没有 Linux/macOS，
      #:       `libhblight.so` / `.dylib` **一次都没产出过**」。
      #:     ⇒ 而那一层里**真有**一个平台假设：`工作区 = r"C:\hblight"` 是写死的，
      #:       在 POSIX 上会变成相对路径 `./C:\hblight`（反斜杠不是分隔符），
      #:       症状离真因很远。（**已修**：POSIX 用 `/tmp/hblight`。）
      #:
      #:   ⇒ 「只在本机构建过」和「三平台能构建」是**两件事**，
      #:     而前者永远发现不了后者的问题。CI 就是干这个的。
      #:
      #:   ⚠ 这一步**允许在没装 CMake 的 runner 上跳过**吗？**不允许** ——
      #:     三个 runner 都自带 cmake（ubuntu/macos/windows-2025 镜像里都有）。
      #:     跳过就等于把这条判据变成装饰。
      - name: Build C++ core (libhblight)
        shell: bash
        run: |
          set -e
          cmake --version | head -1
          python _build/build_hblight.py --go

      #: ⭐ **逐位对账** —— C++ 与 Python 在**同一份确定性脚本**上逐行比字符串。
      #:   ⚠ 它比"跑一遍没报错"强得多：它证明两边**算的是同一件事**。
      #:   ⚠ 而队友交代过一条前提：75/75 是**本机 ucrt** 的结果，
      #:     `hypot/cos/sin/pow` 换 libm 可能差最后一位 ⇒ **这一步正是要试出来**。
      - name: C++ vs Python bit-for-bit
        shell: bash
        run: python native/hblight/tests/diff_python.py

      #: ⭐ **证明走的真是 C++ 那条路**（不是静默退回 Python）。
      #:   ⚠ 队友第一次就差点报了假绿：dll 加载失败 ⇒ 按设计静默退回
      #:     ⇒ `test_pyengine` 全绿，**但绿的是 Python 版**。
      #:   ⇒ 所以"生效"必须**单独断言一次**，不能靠"测试通过了"推断。
      #: ⚠⚠⚠ **必须显式 `HBLIGHT_ENABLE=1`** —— 这一点我第一版写漏了。
      #:
      #:   `pyengine_c` 的默认是**关**（`HBLIGHT_ENABLE=1` 才启用），
      #:   理由是实测：逐操作粒度的 ctypes 包一层会让产品**慢 4.5 倍**
      #:   （0.7335 → 3.3097 ms/帧，1000 对象；几百万次跨语言往返）。
      #:   ⇒ 所以"内核在"**不等于**"内核在用"。
      #:
      #:   ⚠ 我第一版没设这个变量 ⇒ 这一步骤会看到"走的是 Python"而误报失败，
      #:     或者更坏：**它根本证明不了 C++ 路**。
      #:   ⇒ 想验 C++ 路，必须**显式开**，再断言真的走了。
      - name: Prove the C++ path is actually taken
        shell: bash
        env:
          HBLIGHT_ENABLE: "1"
        run: |
          set -e
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          from hybridengine_light import pyengine as E
          from hybridengine_light import pyengine_c as C
          print("HBLIGHT_ENABLE =", os.environ.get("HBLIGHT_ENABLE"))
          print("可用 =", C.可用())
          if not C.可用():
              print("!! C++ 内核没加载上 —— 那这个 runner 的构建是坏的")
              sys.exit(1)
          mod = E.向量.__module__
          print("向量.__module__ =", mod)
          if "pyengine_c" not in mod:
              print("!! 内核可用、但**没被启用** ⇒ 走的是 Python 版")
              print("   （检查 HBLIGHT_ENABLE 有没有传进来）")
              sys.exit(1)
          print("OK：C++ 内核真的**在用**")
          PY

      #: ⭐ **反面**：默认（不开）时必须**退回 Python**，而且**不许崩**。
      #:   ⚠ 这条同样重要 —— 手机版 Chaquopy 里加载不到 `.so`，
      #:     靠的就是"不在就用 Python"。**"默认关"本身也是产品行为，要钉住。**
      - name: Default must fall back to Python (no crash)
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from hybridengine_light import pyengine as E
          mod = E.向量.__module__
          print("默认 向量.__module__ =", mod)
          if "pyengine_c" in mod:
              print("!! 默认竟然是 C++ —— 那产品默认会慢 4.5 倍")
              sys.exit(1)
          print("OK：默认走 Python（回退路成立）")
          PY

      #: 主判据②：全套测试。退出码就是判据。
      #: ⚠ Linux 套 xvfb-run -a —— 第二批要真开 tkinter 窗口，无头 runner 没有 X。
      #:   `-a` = 自动挑没被占的 display 号，不加会撞车。
      - name: Full test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python _build/run_tests.py

      - name: Full test suite (Windows / macOS)
        if: runner.os != 'Linux'
        run: python _build/run_tests.py

      - name: Collect logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.label }}
          path: |
            _build/_log_*.txt
            _build/报告/**
          if-no-files-found: ignore
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  #  ⭐ Linux **打包** —— 目标里唯一整块没验的东西
  # ══════════════════════════════════════════════════════════════════════════
  #
  #  ## 为什么单独一个 job
  #
  #  `build_linux_packages.sh` 里写着「**这一环必须在 Linux 机器上执行**。
  #  这是物理限制，不是没做」—— AppImage 要 `appimagetool`、`.deb` 要 `dpkg-deb`，
  #  而 PyInstaller 的 bootloader 是**预编译的**，交叉编译走不通。
  #
  #  ⚠ 开发机只有 Windows ⇒ **这个脚本在真 Linux 上一次都没跑过**，
  #    一直标着"未验"。而 GitHub 的 `ubuntu-24.04` runner 正是那个"Linux 机器"。
  #
  #  ⇒ 这个 job 就是把它从"未验"变成"验过"的**唯一**办法。
  #
  #  ## 判据（三层，一层比一层硬）
  #
  #    ① `sh _build/build_linux_packages.sh --go` **退出码 0**
  #    ② 产出的包里，**清单里的东西都在**（`_build/_release_gate.py`）
  #       ⚠ 这条是刚需：10-12 那个源码包就少了 `sample_gui.py` / `watchdog.py`
  #         而**打包照样"成功"** ⇒ 光看退出码不够
  #    ③ 解出来**真能跑**：`python -m hybridengine_light --help`（无头，只要 CLI 能起）
  #
  #  ⚠ 不要求 AppImage 成功：`appimagetool` 要联网下载且不是标准包
  #    ⇒ 脚本自己会"缺什么说什么"，**那不算失败**。判据只钉 tar.gz 与（有 dpkg 时的）.deb。
  package-linux:
    name: Linux 打包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      #: ⚠ tkinter 是**独立包**（Ubuntu 的 python3 默认不带）；
      #:   本项目两个图形界面都靠它，而 `_check_platform.py` 会查它。
      #: ⚠ `dpkg-deb` 在 ubuntu runner 上本来就有（`dpkg` 是基础包）——
      #:   这里显式装一次是为了"缺了什么一眼看到"，不是为了补。
      - name: 装打包要的东西
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb dpkg
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: 工具版本（诊断）
        shell: bash
        run: |
          python -V
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          dpkg-deb --version | head -1
          echo "glibc: $(ldd --version | head -1)"

      #: ⚠ 先跑 `--go` 之外的**只读检查**：它会把"要装什么、能打什么"打出来。
      #:   如果这一步就红，日志里能立刻看到缺什么（比打到一半失败好查）。
      - name: 打包前置检查（只读）
        run: sh _build/build_linux_packages.sh

      - name: 真打（tar.gz / AppImage / .deb）
        run: sh _build/build_linux_packages.sh --go

      #: ⭐ 判据②：包里的东西齐不齐（用统一那道闸门，不另写一套）
      - name: 验包内容（发布物完整性）
        run: python _build/_verify_linux_packages.py

      #: ⭐ 判据③：解出来**真能起**
      - name: 验包能跑（解出来真起一次）
        run: python _build/_verify_linux_packages.py --跑

      - name: 留下产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: 发布/*
          if-no-files-found: ignore
          retention-days: 7
